{{/* 模型目录候选（models.dev）：桥渲染，前端只负责把 data-* 填进表单（B70）。 */}}
<strong>模型目录：{{.Total}} 条，匹配 {{len .Rows}}</strong>{{if .Query}}<span class="hint"> 按 “{{.Query}}” 过滤</span>{{end}}
<ul class="catalog-list">{{range .Rows}}<li><button type="button" class="catalog-item" data-catalog-id="{{.ID}}" data-catalog-name="{{.Name}}" data-catalog-ctx="{{.ContextSize}}" data-catalog-max="{{.MaxTokens}}" data-catalog-reasoning="{{if .Reasoning}}1{{end}}" data-catalog-image="{{if .Image}}1{{end}}"><span class="catalog-id">{{.ID}}</span><span class="catalog-meta">{{if .Name}}{{.Name}}{{end}}{{if .ContextSize}} · ctx {{.ContextSize}}{{end}}{{if .MaxTokens}} · out {{.MaxTokens}}{{end}}{{if .Reasoning}} · 推理{{end}}</span></button></li>{{else}}<li class="catalog-empty">没有匹配的模型。</li>{{end}}</ul>
