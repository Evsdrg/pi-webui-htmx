{{/* 侧栏会话列表：只渲染列表项，不含正文 */}}
{{range .Items}}
<div class="session-item {{if eq .ID $.Selected}}selected{{end}}"
     hx-get="/ui/sessions/{{.ID}}/history"
     hx-trigger="click"
     hx-target="#turns"
     hx-swap="innerHTML">
  <span class="session-title">{{.Title}}</span>
  <span class="session-meta">{{.Modified}}</span>
</div>
{{else}}
<p class="muted">没有会话</p>
{{end}}
{{if .HasMore}}
<div hx-get="/ui/sessions?offset={{.NextOffset}}"
     hx-trigger="revealed"
     hx-swap="afterend">
  <p class="muted">加载更多…</p>
</div>
{{end}}
