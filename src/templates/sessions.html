{{range .Items}}
<a class="session-item{{if eq .ID $.Selected}} selected{{end}}" href="?session={{.ID}}" data-session="{{.ID}}" data-cwd="{{.Cwd}}" data-title="{{.Title}}">
  <span class="session-title">{{.Title}}</span>
  <span class="session-meta"><time>{{.Modified}}</time><span title="{{.Cwd}}">{{.Cwd}}</span></span>
</a>
{{else}}<p class="empty-note">还没有会话。新建一个，开始协作。</p>{{end}}
{{if .HasMore}}<button class="btn" hx-get="ui/sessions?offset={{.NextOffset}}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="this">加载更多会话</button>{{end}}
