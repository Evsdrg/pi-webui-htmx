<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Bridge</title>
{{/* 资源路径由桥注入，文件名带内容哈希，可长期不可变缓存 */}}
{{range .CSS}}<link rel="stylesheet" href="/assets/{{.}}">{{end}}
</head>
<body data-session-id="{{.SessionID}}" hx-history="false">
<header class="topbar">
  <span class="brand">Pi Bridge</span>
  <span id="conn-state" class="state state-offline">未连接</span>
  <span id="session-state" class="state">空闲</span>
  <span id="ext-status-slot" hx-get="/ui/extensions/status" hx-trigger="load, every 5s" hx-swap="innerHTML"></span>
</header>
<main class="app-shell">
  <aside class="sidebar"
         hx-get="/ui/sessions"
         hx-trigger="load, every 10s"
         hx-swap="innerHTML">
    <p class="muted">正在加载会话…</p>
  </aside>

  <section class="conversation">
    {{/* 翻页哨兵的挂载点。它必须在 #turns 之外，
         否则 afterbegin 会把新哨兵一起插入并立刻再次触发。 */}}
    <div id="older-slot"></div>

    <div id="turns"
         hx-get="/ui/sessions/{{.SessionID}}/history"
         hx-trigger="load"
         hx-swap="innerHTML">
      <p class="muted">正在加载历史…</p>
    </div>

    <div id="live" class="live" hidden></div>

    {{/* 扩展对话挂载点：Pi 推来 select/confirm/input/editor 时由 WS 层填充 */}}
    <div id="ext-dialog-slot"
         hx-get="/ui/extensions/dialogs?sessionId={{.SessionID}}"
         hx-trigger="load, ext-dialog from:body"
         hx-swap="innerHTML"></div>

    <form id="composer"
          hx-post="/ui/sessions/{{.SessionID}}/prompt"
          hx-target="#live"
          hx-swap="none"
          hx-on::after-request="if(event.detail.successful) this.reset()">
      <textarea name="text" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="composer-actions">
        <select name="model" hx-get="/ui/models" hx-trigger="load" hx-swap="innerHTML">
          <option value="">加载模型中…</option>
        </select>
        <button type="submit" class="btn btn-primary">发送</button>
        <button type="button" class="btn" hx-post="/ui/sessions/{{.SessionID}}/abort" hx-swap="none">中止</button>
      </div>
    </form>
  </section>
</main>
{{range .JS}}<script type="module" src="/assets/{{.}}"></script>{{end}}
</body>
</html>
