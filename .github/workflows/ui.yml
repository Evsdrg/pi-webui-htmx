name: UI 检查

on:
  push:
    paths: ['pi-webui-htmx/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['pi-webui-htmx/**', '.github/workflows/ui.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      # 先打印环境：首次失败时没有这些信息，只能靠猜。
      - name: 环境诊断
        working-directory: pi-webui-htmx
        run: |
          node -v
          npm -v
          echo "npm 全局前缀: $(npm prefix -g)"
          echo "声明的包管理器: $(node -p 'require("./package.json").packageManager')"
          echo "registry: $(npm config get registry)"
      # 这个脚本负责重试与把失败详情写进注解，两个 workflow 共用一份逻辑。
      - name: 安装锁定的包管理器与依赖
        working-directory: pi-webui-htmx
        run: bash ../.github/scripts/install-deps.sh
      - name: 单测、类型、构建与契约
        working-directory: pi-webui-htmx
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm check
