name: Go 检查

on:
  push:
    paths: ['pi-bridge-go/**', 'pi-webui-htmx/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['pi-bridge-go/**', 'pi-webui-htmx/**', '.github/workflows/go.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pi-bridge-go/go.mod
      # 跨目录契约测试要读 UI 包（模板、manifest、dist），所以先构建前端。
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: 构建 UI 包（跨目录测试需要）
        working-directory: pi-webui-htmx
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm build
      - name: 格式与 vet
        working-directory: pi-bridge-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      # 固定版本：2025 及更早的 staticcheck 读不了 Go 1.27 的导出数据
      # （报 “export data version 4 is greater than maximum supported version 2”）。
      # 规则与排除项见 pi-bridge-go/staticcheck.conf。
      - name: staticcheck
        working-directory: pi-bridge-go
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: 竞态测试（含跨目录契约）
        working-directory: pi-bridge-go
        env:
          PI_WEBUI_DIR: ../pi-webui-htmx
        run: go test -race -count=1 ./...
      # UI 包在 CI 里必定存在，因此**不允许**有跨目录测试被跳过：
      # 一旦路径解析或构建产物出问题而测试静默跳过，上面的“全绿”就是假的。
      - name: 确认没有测试被跳过
        working-directory: pi-bridge-go
        env:
          PI_WEBUI_DIR: ../pi-webui-htmx
        run: |
          go test -v -count=1 ./internal/transport/ ./internal/presentation/ > /tmp/skipcheck.log
          if grep -q '^--- SKIP' /tmp/skipcheck.log; then
            echo '以下测试被跳过，但 CI 环境应当全部执行：' >&2
            grep '^--- SKIP' /tmp/skipcheck.log >&2
            exit 1
          fi
