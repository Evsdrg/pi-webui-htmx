<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Bridge</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/htmx.min.js"></script>
</head>
<body hx-history="false">
<header class="topbar">
  <span class="brand">Pi Bridge</span>
  <span id="conn-state" class="state state-offline">未连接</span>
  <span id="session-state" class="state">空闲</span>
</header>
<main class="layout">
  <aside class="sidebar"
         hx-get="/ui/sessions"
         hx-trigger="load, every 10s"
         hx-swap="innerHTML">
    <p class="muted">正在加载会话…</p>
  </aside>

  <section class="conversation">
    <div id="turns"
         hx-get="/ui/sessions/{{.SessionID}}/history"
         hx-trigger="load"
         hx-swap="innerHTML">
      <p class="muted">正在加载历史…</p>
    </div>

    <div id="live" class="live" hidden></div>

    <form id="composer"
          hx-on::after-request="this.reset()"
          hx-post="/ui/sessions/{{.SessionID}}/prompt"
          hx-target="#live"
          hx-swap="none">
      <textarea name="text" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="composer-actions">
        <select name="model" hx-get="/ui/models" hx-trigger="load" hx-swap="innerHTML">
          <option value="">加载模型中…</option>
        </select>
        <button type="submit">发送</button>
        <button type="button" hx-post="/ui/sessions/{{.SessionID}}/abort" hx-swap="none">中止</button>
      </div>
    </form>
  </section>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
